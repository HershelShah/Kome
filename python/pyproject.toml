[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kome"
version = "0.0.1"
description = "Python bindings for Kome peer-to-peer data replication middleware"
requires-python = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]

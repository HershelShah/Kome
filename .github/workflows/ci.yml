name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean model (machine-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build every theorem
        run: ./lean/build.sh

  modules:
    name: List SPARK modules
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        name: One entry per spark/src/kome-*.adb
        run: |
          list=$(ls spark/src/kome-*.adb | sed 's|.*/kome-||; s|\.adb$||' | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  spark:
    name: SPARK ${{ matrix.module }} (build, test, prove)
    needs: modules
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build, run the tests, prove
        run: ./spark/check.sh ${{ matrix.module }}

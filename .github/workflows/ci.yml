name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
          - name: Debug
            build_type: Debug
          - name: ASan
            build_type: Debug
            sanitizer: address
          - name: TSan
            build_type: Debug
            sanitizer: thread
          - name: UBSan
            build_type: Debug
            sanitizer: undefined

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DCMAKE_C_FLAGS="-Werror" \
            ${{ matrix.sanitizer && format('-DSYNC_SANITIZER={0}', matrix.sanitizer) || '' }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

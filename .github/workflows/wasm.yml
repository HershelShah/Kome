name: WASM

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Emscripten
        run: sudo apt-get update && sudo apt-get install -y emscripten

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build WASM
        run: tools/wasm_build.sh

      - name: Parity test (same scenarios as UDP/TCP/WS, in WASM)
        run: node bindings/wasm/parity.cjs

      - name: GoogleTest suites compiled to WASM, run under Node
        # The literal convergence/reconcile/crypto/security/relay/multinode/
        # resilience/scenario/defensive gtest binaries as .wasm — every
        # transport-agnostic scenario test passing on the WASM target.
        run: tools/wasm_tests.sh

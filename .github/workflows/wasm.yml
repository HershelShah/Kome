name: WASM

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Emscripten
        run: sudo apt-get update && sudo apt-get install -y emscripten

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build WASM
        run: tools/wasm_build.sh

      - name: Smoke test (engine + reconciliation session run in WASM)
        run: node bindings/wasm/smoke.cjs

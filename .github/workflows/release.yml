name: release

# M7 release pipeline, phases 1+2 (docs/PACKAGING.md): on a version tag,
# rebuild + re-gate every artifact by reusing the wheels and npm workflows
# (one build definition each — the release ships exactly what CI gates), then
# publish to PyPI and npm via OIDC only (Trusted Publishing / provenance —
# configure the publishers for `kome-sync` on both registries, no token
# secrets). A manual dispatch publishes the wheels to TestPyPI and skips the
# npm publish, which is the required dry-run before the first real release.
# The amalgamation artifact joins this workflow in phase 3.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry-run: publishes to TestPyPI

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The tag must match CMake's project(VERSION) — the single source of
      # truth the wheel metadata is generated from (P7.0c).
      - name: Tag matches CMake version
        if: github.ref_type == 'tag'
        run: |
          v="$(tools/version.sh)"
          echo "CMake version: $v  tag: $GITHUB_REF_NAME"
          test "v$v" = "$GITHUB_REF_NAME"

  # Same wheel matrix + sdist + packaged-artifact test gates as per-PR CI.
  build:
    needs: check-version
    uses: ./.github/workflows/wheels.yml

  # Same npm tarball + parity/smoke/types/browser gates as per-PR CI.
  build-npm:
    needs: check-version
    uses: ./.github/workflows/npm.yml

  # Same amalgamation suite + drop-in gates as per-PR CI; uploads the zip.
  build-amalgamation:
    needs: check-version
    uses: ./.github/workflows/amalgamation.yml

  publish-pypi:
    # Everything publishes together or not at all — a failed gate on any
    # channel must not leave another a version ahead (tags can't cleanly
    # re-publish).
    needs: [build, build-npm, build-amalgamation]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      # Only the Python artifacts — an unfiltered download would also pull
      # the npm tarball and amalgamation zip into dist/ and fail the upload.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.ref_type == 'tag' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # Dry-runs may re-publish an unbumped version to TestPyPI; don't
          # fail the workflow on the duplicate.
          skip-existing: ${{ github.ref_type != 'tag' }}

  publish-npm:
    # Tags only — npm has no TestPyPI equivalent, so the manual-dispatch
    # dry-run stops at the fully-gated tarball artifact. Waits on the other
    # channels' gates too (see publish-pypi).
    if: github.ref_type == 'tag'
    needs: [build, build-npm, build-amalgamation]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing (OIDC) — configure on npmjs.com
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Provenance + trusted publishing need a current npm client.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Publish
        run: npm publish ./kome-sync-*.tgz --provenance --access public

  release-assets:
    # The amalgamation ships as a GitHub Release asset (it's generated, never
    # committed — this download URL is the two-file distribution channel).
    # Runs after the registry publishes so a failed channel doesn't leave a
    # public release pointing at a version the registries never got.
    if: github.ref_type == 'tag'
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + attach assets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: amalgamation
      # First-party gh CLI (no third-party action with write access); the
      # upload fallback keeps re-runs of a tag idempotent.
      - name: Create the GitHub Release with the amalgamation attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
             kome-*-amalgamation.zip \
          || gh release upload "$GITHUB_REF_NAME" --clobber kome-*-amalgamation.zip

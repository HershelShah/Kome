name: release

# M7 release pipeline, phases 1+2 (docs/PACKAGING.md): on a version tag,
# rebuild + re-gate every artifact by reusing the wheels and npm workflows
# (one build definition each — the release ships exactly what CI gates), then
# publish to PyPI and npm via OIDC only (Trusted Publishing / provenance —
# configure the publishers for `kome-sync` on both registries, no token
# secrets). A manual dispatch publishes the wheels to TestPyPI and skips the
# npm publish, which is the required dry-run before the first real release.
# The amalgamation artifact joins this workflow in phase 3.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry-run: publishes to TestPyPI

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The tag must match CMake's project(VERSION) — the single source of
      # truth the wheel metadata is generated from (P7.0c).
      - name: Tag matches CMake version
        if: github.ref_type == 'tag'
        run: |
          v="$(sed -n 's/^project(sync_engine VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          echo "CMake version: $v  tag: $GITHUB_REF_NAME"
          test "v$v" = "$GITHUB_REF_NAME"

  # Same wheel matrix + sdist + packaged-artifact test gates as per-PR CI.
  build:
    needs: check-version
    uses: ./.github/workflows/wheels.yml

  # Same npm tarball + parity/smoke/types/browser gates as per-PR CI.
  build-npm:
    needs: check-version
    uses: ./.github/workflows/npm.yml

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.ref_type == 'tag' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # Dry-runs may re-publish an unbumped version to TestPyPI; don't
          # fail the workflow on the duplicate.
          skip-existing: ${{ github.ref_type != 'tag' }}

  publish-npm:
    # Tags only — npm has no TestPyPI equivalent, so the manual-dispatch
    # dry-run stops at the fully-gated tarball artifact.
    if: github.ref_type == 'tag'
    needs: build-npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing (OIDC) — configure on npmjs.com
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Provenance + trusted publishing need a current npm client.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Publish
        run: npm publish ./kome-sync-*.tgz --provenance --access public
